name: CI/CD - Cidades ESG

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: 1 - Build
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Compilar e empacotar
        run: |
          chmod +x mvnw
          ./mvnw -B clean package -DskipTests

  tests:
    name: 2 - Testes automatizados
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Executar testes com H2
        run: |
          chmod +x mvnw
          ./mvnw -B test

  docker-build:
    name: 3 - Docker Build
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - name: Construir imagem
        run: docker build --tag cidades-esg:${{ github.sha }} .

  deploy-staging:
    name: 4 - Deploy Staging e Smoke Test
    runs-on: ubuntu-latest
    needs: docker-build
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Subir staging containerizado
        run: docker compose -f docker-compose.staging.yml up --build -d
      - name: Aguardar saúde e testar staging
        shell: bash
        run: |
          for tentativa in {1..30}; do
            if curl --fail --silent http://localhost:8081/actuator/health | grep -q '"status":"UP"'; then
              echo "Staging saudável"
              exit 0
            fi
            echo "Aguardando staging ($tentativa/30)..."
            sleep 5
          done
          docker compose -f docker-compose.staging.yml ps
          docker compose -f docker-compose.staging.yml logs
          exit 1
      - name: Exibir containers
        run: docker compose -f docker-compose.staging.yml ps
      - name: Encerrar staging
        if: always()
        run: docker compose -f docker-compose.staging.yml down -v

  deploy-production:
    name: 5 - Deploy Produção e Smoke Test
    runs-on: ubuntu-latest
    needs: deploy-staging
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Subir produção containerizada
        run: docker compose -f docker-compose.prod.yml up --build -d
      - name: Aguardar saúde e testar produção
        shell: bash
        run: |
          for tentativa in {1..30}; do
            if curl --fail --silent http://localhost:8082/actuator/health | grep -q '"status":"UP"'; then
              echo "Produção saudável"
              exit 0
            fi
            echo "Aguardando produção ($tentativa/30)..."
            sleep 5
          done
          docker compose -f docker-compose.prod.yml ps
          docker compose -f docker-compose.prod.yml logs
          exit 1
      - name: Exibir containers
        run: docker compose -f docker-compose.prod.yml ps
      - name: Encerrar produção
        if: always()
        run: docker compose -f docker-compose.prod.yml down -v

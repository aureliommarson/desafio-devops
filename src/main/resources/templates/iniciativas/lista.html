<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciativas | Cidades ESG</title><script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex min-h-screen flex-col bg-slate-50 text-slate-800">
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="mx-auto w-full max-w-7xl flex-1 px-4 py-8 sm:px-6">
    <div class="mb-6 flex flex-col justify-between gap-4 sm:flex-row sm:items-center">
        <div><p class="text-sm font-semibold uppercase tracking-wider text-emerald-700">Gestão ESG</p><h1 class="text-3xl font-bold text-slate-900">Iniciativas</h1><p class="mt-1 text-slate-500">Consulte e gerencie as ações sustentáveis cadastradas.</p></div>
        <a th:href="@{/iniciativas/nova}" class="rounded-lg bg-emerald-700 px-5 py-3 text-center font-semibold text-white shadow hover:bg-emerald-800">+ Nova iniciativa</a>
    </div>

    <div th:if="${sucesso}" class="mb-5 rounded-lg border border-emerald-200 bg-emerald-50 px-4 py-3 text-emerald-800" role="alert" th:text="${sucesso}"></div>

    <div class="overflow-hidden rounded-xl border border-slate-200 bg-white shadow-sm">
        <div th:if="${#lists.isEmpty(iniciativas)}" class="p-10 text-center"><p class="text-lg font-semibold">Nenhuma iniciativa cadastrada</p><p class="mt-1 text-slate-500">Cadastre a primeira ação sustentável da cidade.</p></div>
        <div th:unless="${#lists.isEmpty(iniciativas)}" class="overflow-x-auto">
            <table class="min-w-full divide-y divide-slate-200">
                <thead class="bg-slate-50"><tr><th class="px-5 py-3 text-left text-xs font-semibold uppercase text-slate-500">Iniciativa</th><th class="px-5 py-3 text-left text-xs font-semibold uppercase text-slate-500">Categoria</th><th class="px-5 py-3 text-left text-xs font-semibold uppercase text-slate-500">Status</th><th class="px-5 py-3 text-center text-xs font-semibold uppercase text-slate-500">Impacto</th><th class="px-5 py-3 text-right text-xs font-semibold uppercase text-slate-500">Ações</th></tr></thead>
                <tbody class="divide-y divide-slate-100">
                <tr th:each="item : ${iniciativas}" class="hover:bg-slate-50">
                    <td class="px-5 py-4"><p class="font-semibold text-slate-900" th:text="${item.titulo}">Título</p><p class="text-sm text-slate-500" th:text="${item.cidade}">Cidade</p></td>
                    <td class="px-5 py-4"><span class="whitespace-nowrap rounded-full px-3 py-1 text-xs font-semibold" th:classappend="${item.categoria.name() == 'AMBIENTAL'} ? 'bg-emerald-100 text-emerald-800' : (${item.categoria.name() == 'SOCIAL'} ? 'bg-blue-100 text-blue-800' : 'bg-violet-100 text-violet-800')" th:text="${item.categoria.descricao}">Categoria</span></td>
                    <td class="px-5 py-4"><span class="whitespace-nowrap rounded-full px-3 py-1 text-xs font-semibold" th:classappend="${item.status.name() == 'CONCLUIDA'} ? 'bg-emerald-100 text-emerald-800' : (${item.status.name() == 'EM_ANDAMENTO'} ? 'bg-amber-100 text-amber-800' : 'bg-slate-100 text-slate-700')" th:text="${item.status.descricao}">Status</span></td>
                    <td class="px-5 py-4 text-center"><span class="inline-flex h-9 w-9 items-center justify-center rounded-full bg-teal-50 font-bold text-teal-700" th:text="${item.pontuacaoImpacto}">8</span></td>
                    <td class="whitespace-nowrap px-5 py-4 text-right text-sm font-semibold"><a th:href="@{/iniciativas/{id}(id=${item.id})}" class="text-blue-700 hover:underline">Ver</a><a th:href="@{/iniciativas/{id}/editar(id=${item.id})}" class="ml-3 text-emerald-700 hover:underline">Editar</a></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>

<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title
      th:text="${modoEdicao ? 'Editar iniciativa' : 'Nova iniciativa'} + ' | Cidades ESG'"
    >
      Formulário
    </title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="flex min-h-screen flex-col bg-slate-50 text-slate-800">
    <nav th:replace="~{fragments/layout :: navbar}"></nav>
    <main class="mx-auto w-full max-w-3xl flex-1 px-4 py-8 sm:px-6">
      <a
        th:href="@{/iniciativas}"
        class="text-sm font-semibold text-emerald-700 hover:underline"
      >
        Voltar para iniciativas</a
      >
      <div
        class="mt-4 overflow-hidden rounded-xl border border-slate-200 bg-white shadow-sm"
      >
        <div class="border-b border-slate-200 px-6 py-5">
          <h1
            class="text-2xl font-bold"
            th:text="${modoEdicao ? 'Editar iniciativa' : 'Cadastrar iniciativa'}"
          >
            Cadastrar iniciativa
          </h1>
          <p class="mt-1 text-sm text-slate-500">
            Preencha os dados da ação ESG. Campos com * são obrigatórios.
          </p>
        </div>
        <form
          th:object="${iniciativa}"
          th:action="${modoEdicao} ? @{/iniciativas/{id}(id=${iniciativa.id})} : @{/iniciativas}"
          method="post"
          class="space-y-5 p-6"
          novalidate
        >
          <div>
            <label for="titulo" class="mb-1 block text-sm font-semibold"
              >Título *</label
            ><input
              id="titulo"
              type="text"
              th:field="*{titulo}"
              maxlength="120"
              class="w-full rounded-lg border border-slate-300 px-3 py-2.5 outline-none focus:border-emerald-600 focus:ring-2 focus:ring-emerald-100"
              th:errorclass="border-red-500"
              placeholder="Ex.: Iluminação pública eficiente"
            />
            <p
              th:if="${#fields.hasErrors('titulo')}"
              th:errors="*{titulo}"
              class="mt-1 text-sm text-red-600"
            ></p>
          </div>
          <div>
            <label for="descricao" class="mb-1 block text-sm font-semibold"
              >Descrição *</label
            ><textarea
              id="descricao"
              th:field="*{descricao}"
              maxlength="1000"
              rows="4"
              class="w-full rounded-lg border border-slate-300 px-3 py-2.5 outline-none focus:border-emerald-600 focus:ring-2 focus:ring-emerald-100"
              th:errorclass="border-red-500"
              placeholder="Descreva objetivo e alcance da iniciativa"
            ></textarea>
            <p
              th:if="${#fields.hasErrors('descricao')}"
              th:errors="*{descricao}"
              class="mt-1 text-sm text-red-600"
            ></p>
          </div>
          <div>
            <label for="cidade" class="mb-1 block text-sm font-semibold"
              >Cidade *</label
            ><input
              id="cidade"
              type="text"
              th:field="*{cidade}"
              maxlength="100"
              class="w-full rounded-lg border border-slate-300 px-3 py-2.5 outline-none focus:border-emerald-600 focus:ring-2 focus:ring-emerald-100"
              th:errorclass="border-red-500"
              placeholder="Ex.: São Paulo"
            />
            <p
              th:if="${#fields.hasErrors('cidade')}"
              th:errors="*{cidade}"
              class="mt-1 text-sm text-red-600"
            ></p>
          </div>
          <div class="grid gap-5 sm:grid-cols-2">
            <div>
              <label for="categoria" class="mb-1 block text-sm font-semibold"
                >Categoria *</label
              ><select
                id="categoria"
                th:field="*{categoria}"
                class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2.5 outline-none focus:border-emerald-600"
                th:errorclass="border-red-500"
              >
                <option value="">Selecione</option>
                <option
                  th:each="opcao : ${categorias}"
                  th:value="${opcao}"
                  th:text="${opcao.descricao}"
                ></option>
              </select>
              <p
                th:if="${#fields.hasErrors('categoria')}"
                th:errors="*{categoria}"
                class="mt-1 text-sm text-red-600"
              ></p>
            </div>
            <div>
              <label for="status" class="mb-1 block text-sm font-semibold"
                >Status *</label
              ><select
                id="status"
                th:field="*{status}"
                class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2.5 outline-none focus:border-emerald-600"
                th:errorclass="border-red-500"
              >
                <option value="">Selecione</option>
                <option
                  th:each="opcao : ${statusDisponiveis}"
                  th:value="${opcao}"
                  th:text="${opcao.descricao}"
                ></option>
              </select>
              <p
                th:if="${#fields.hasErrors('status')}"
                th:errors="*{status}"
                class="mt-1 text-sm text-red-600"
              ></p>
            </div>
          </div>
          <div>
            <label
              for="pontuacaoImpacto"
              class="mb-1 block text-sm font-semibold"
              >Pontuação de impacto (1 a 10) *</label
            ><input
              id="pontuacaoImpacto"
              type="number"
              min="1"
              max="10"
              th:field="*{pontuacaoImpacto}"
              class="w-full rounded-lg border border-slate-300 px-3 py-2.5 outline-none focus:border-emerald-600 focus:ring-2 focus:ring-emerald-100 sm:w-48"
              th:errorclass="border-red-500"
            />
            <p
              th:if="${#fields.hasErrors('pontuacaoImpacto')}"
              th:errors="*{pontuacaoImpacto}"
              class="mt-1 text-sm text-red-600"
            ></p>
          </div>
          <div
            class="flex flex-col-reverse gap-3 border-t border-slate-100 pt-5 sm:flex-row sm:justify-end"
          >
            <a
              th:href="@{/iniciativas}"
              class="rounded-lg border border-slate-300 px-5 py-2.5 text-center font-semibold text-slate-700 hover:bg-slate-50"
              >Cancelar</a
            ><button
              type="submit"
              class="rounded-lg bg-emerald-700 px-5 py-2.5 font-semibold text-white shadow hover:bg-emerald-800"
              th:text="${modoEdicao ? 'Salvar alterações' : 'Cadastrar iniciativa'}"
            >
              Salvar
            </button>
          </div>
        </form>
      </div>
    </main>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
  </body>
</html>

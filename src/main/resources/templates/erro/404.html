<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Não encontrado | Cidades ESG</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="flex min-h-screen flex-col bg-slate-50 text-slate-800">
    <nav th:replace="~{fragments/layout :: navbar}"></nav>
    <main class="flex flex-1 items-center justify-center px-4">
      <div class="text-center">
        <p class="text-7xl font-bold text-emerald-700">404</p>
        <h1 class="mt-4 text-2xl font-bold">Iniciativa não encontrada</h1>
        <p class="mt-2 text-slate-500" th:text="${mensagem}">
          O registro solicitado não existe.
        </p>
        <a
          th:href="@{/iniciativas}"
          class="mt-6 inline-block rounded-lg bg-emerald-700 px-5 py-3 font-semibold text-white hover:bg-emerald-800"
          >Voltar para iniciativas</a
        >
      </div>
    </main>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
  </body>
</html>

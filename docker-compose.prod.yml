name: cidades-esg-production

services:
  postgres-prod:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${PROD_DB_NAME:-cidades_esg_prod}
      POSTGRES_USER: ${PROD_DB_USER:-prod_user}
      POSTGRES_PASSWORD: ${PROD_DB_PASSWORD:-prod_password}
    volumes:
      - postgres-prod-data:/var/lib/postgresql/data
    networks: [esg-prod-network]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app-prod:
    build: .
    environment:
      DB_HOST: postgres-prod
      DB_PORT: 5432
      DB_NAME: ${PROD_DB_NAME:-cidades_esg_prod}
      DB_USER: ${PROD_DB_USER:-prod_user}
      DB_PASSWORD: ${PROD_DB_PASSWORD:-prod_password}
      SPRING_PROFILES_ACTIVE: prod
    ports:
      - "8082:8080"
    depends_on:
      postgres-prod:
        condition: service_healthy
    networks: [esg-prod-network]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  postgres-prod-data:

networks:
  esg-prod-network:
    driver: bridge
